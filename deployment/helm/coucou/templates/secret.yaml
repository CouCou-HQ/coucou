{{/* Only rendered for values given inline. An existing Secret is referenced, never copied. */}}
{{- if or (and .Values.discord.token (not .Values.discord.existingSecret)) (and .Values.database.url (not .Values.database.existingSecret)) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "coucou.fullname" . }}
  labels:
    {{- include "coucou.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- if and .Values.discord.token (not .Values.discord.existingSecret) }}
  discord-token: {{ .Values.discord.token | quote }}
  {{- end }}
  {{- if and .Values.database.url (not .Values.database.existingSecret) }}
  database-url: {{ .Values.database.url | quote }}
  {{- end }}
{{- end }}

# A character for a bot running on coucou. Copy to profiles/<id>/profile.toml in a checkout, or to
# /var/lib/coucou/profiles/<id>/profile.toml when installed; its sounds go in sounds/ beside it.
# Reloaded within about 40 s of an edit. sounds/ reloads on its own.

id       = "lenore"             # required: lowercase letters, digits and dashes
nickname = "Lenore"             # optional: what replies call the bot, over its server nickname and Discord name
# application_id = ""           # optional: the character's own bot, so other bots can advertise it; its avatar is used without an avatar.*
# preview = ["knock", "drum"]   # optional: up to 3 sounds /character preview plays; random ones fill the rest
# keywords = ["goth", "poetry"] # optional: words in a server's name, description or channels that suggest this character
emoji    = "🖤"                  # optional: in front of the /help and /about titles
color    = "#4E5058"            # optional: embed accent in servers playing this character, #RRGGBB; default config.toml's color
tagline  = "Says something mean she definitely means nicely."
lore     = """
Nobody invited her. She came anyway, and she is not leaving until she has said her piece.
"""
traits   = ["sits in silence too long", "loves leaving without a sound"]   # quirks to read in /about; they change nothing

# What a server starts with before anyone changes it. Seeding never touches a server that already
# has settings, so changing these only reaches servers the bot joins afterwards.
[defaults]
chance   = 5     # % per 5-minute tick, rolled only when someone is in voice; 0-100
suspense = 0     # max seconds of silence before the sound; 0-20
fakeout  = 0     # % of visits that leave without a sound; 0-50
encore   = 0     # % of visits that come back for a second sound; 0-50

# Sounds that play together in one visit: the bot stays in the channel from the first step to the
# last. The first step is picked like any sound; later ones are never picked first, but /play still
# reaches them. A step's sound is its file name without tags or .ogg. Repeat [[chains]] per chain.
[[chains]]
chance = 80   # % of the time the rest follow the first step; 0-100, default 100
steps  = [
  { sound = "knock" },
  { sound = "whos_there", after = 2 },   # seconds of silence before it, still in the channel; 0-20
  { sound = "rimshot" },                 # no after: straight back to back
]

# What an encore comes back with after a sound, by weight, instead of any other sound.
[[links]]
from = "drumroll"
to   = { rimshot = 70, sad_trombone = 30 }

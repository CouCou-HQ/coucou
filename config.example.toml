# Installed: /etc/coucou/config.toml, the default path. From a checkout: copy to config.toml
# (git-ignored); `make dev` and the VS Code launch configs point at it. Anywhere else: -config <path>
# or COUCOU_CONFIG=<path>.
#
# String values may reference the environment as ${VAR} or ${VAR:-default}. An unset ${VAR} with no
# default stops startup. Non-string values (numbers, booleans) are written out literally.

discord_token = "${DISCORD_BOT_TOKEN}"
# postgres://user:pass@host:5432/coucou    -> PostgreSQL (pgx)
# sqlite:///var/lib/coucou/coucou.db or file:coucou.db -> embedded SQLite (pure Go, WAL)
database_url  = "${DATABASE_URL}"

owner_ids = []          # user ids, as strings, that unlock the servers leaderboard
siblings  = ""          # Name=application-id pairs of other coucou bots, comma separated; a Unicode emoji may lead the name

# The characters: profiles/<id>/, each holding profile.toml and sounds/. One character is the bot
# as it always was; with several, default_profile is who a server gets until it picks, and left out
# a server stays quiet until someone picks with /character. Unset, the bot plays the one character at /var/lib/coucou/profile, which is what the
# deprecated profile key points at. From a checkout, "profiles" (git-ignored; start each from
# profile.example.toml).
# profiles        = "/var/lib/coucou/profiles"
# default_profile = "lenore"
note = ""               # markdown under /about and at the end of /help, up to 1024 characters
color = "#E4572E"       # embed accent, #RRGGBB, where a server's character sets none

# What shows under the bot's name in the member list. One for the whole bot, whoever it is in a
# server; a change needs a restart. Emoji go inside text: bots get no emoji slot.
[status]
text     = ""           # up to 128 characters; none shows only the dot
activity = "custom"     # custom (text as is), playing, listening, watching or competing
online   = "online"     # online, idle or dnd

[sounds]
poll = "0s"             # rescan interval for the profile's sounds/; e.g. "15s" on NFS/SMB mounts where inotify doesn't fire

[ops]
http_addr = ":9090"     # /healthz, /readyz and /metrics; "" disables them
log_level = "info"      # debug | info | warn | error. Audit records are stored regardless.
pprof     = false       # serve /debug/pprof on the ops listener
otlp      = ""          # host:port of an OTLP/gRPC collector; "" disables tracing

[gateway]
shard_count = 0         # 0 lets Discord decide. Raise it only to exercise multiple shards.

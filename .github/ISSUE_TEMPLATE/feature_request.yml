name: Feature Request
description: Suggest an improvement or new capability
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Describe what you'd like to see and why it's valuable.

  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Explain the motivation. What are you trying to do that is currently hard or impossible?
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: Describe what you'd like to happen.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Have you tried any workarounds?

  - type: textarea
    id: context
    attributes:
      label: Additional context

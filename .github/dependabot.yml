version: 2
updates:
  # Go modules
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "go"
    groups:
      # Released together and required at one version: one PR, not four.
      otel:
        patterns:
          - "go.opentelemetry.io/*"
      # disgo and its own json, omit, snowflake and godave move together.
      disgo:
        patterns:
          - "github.com/disgoorg/*"
      # sqlite pins an exact libc, so the two only build at matching versions.
      modernc:
        patterns:
          - "modernc.org/*"
      golang-x:
        patterns:
          - "golang.org/x/*"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "github-actions"
    groups:
      # Every action is pinned to a SHA and checked by the same CI run: one PR a week is enough.
      actions:
        patterns:
          - "*"

  # Docker
  - package-ecosystem: "docker"
    directory: "/docker"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "docker"
